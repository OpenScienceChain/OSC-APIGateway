version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 5
    groups:
      npm-development:
        dependency-type: development
        exclude-patterns:
          - '@nestjs/core'
          - bcrypt
          - fsevents
      npm-production:
        dependency-type: production
        exclude-patterns:
          - '@nestjs/core'
          - bcrypt
          - fsevents
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
