name: Supply-chain monitor

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect npm malware indicators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan repository and lockfile without installing dependencies
        run: python3 scripts/security/check_npm_supply_chain.py --repo . --skip-installed
